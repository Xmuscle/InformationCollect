name: Daily Intelligence Report

on:
  schedule:
    - cron: '51 23 * * *'  # UTC 23:51 = 北京 07:51（避开整点高峰）
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: Action
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout engine
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Generate Morning Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_BASE_URL: https://api.x.ai/v1/chat/completions
          XAI_MODEL: x-ai/grok-4-fast
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python cli.py

      - name: Commit report to repo
        run: |
          DATE=$(date -u +%Y-%m-%d)
          REPORT="reports/daily_briefings/Morning_Report_${DATE}.md"

          if [ ! -f "$REPORT" ]; then
            echo "❌ Report not found: $REPORT"
            exit 1
          fi

          echo "📄 Report found: $(wc -c < "$REPORT") bytes"

          git config user.name "Intel Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/

          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "data: daily report ${DATE}"
            git push
            echo "✅ Report committed"
          fi

